#Goal : to deploy the built image from CI steps once CI is completed

name: CD

on:
  workflow_call:
    workflows: ["ci"]
    types: ["completed"]
    branches:
      - 'advanced'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: copy example env to main env
      uses: cp .env.example .env

    - name: docker setup login
      uses: docker/login-action@v4
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: deploy the container with Docker Compose
      run: |
        docker compose pull
        docker compose up -d

      needs: .github/workflows/ci.yml
